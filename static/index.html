<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Transcript Viewer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M12 4h28l14 14v42H12z' fill='%23ffe01b' stroke='%235c4300' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M40 4v14h14' fill='%23ffb700' stroke='%235c4300' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M20 28h24M20 38h24M20 48h16' stroke='%232b1f00' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-dot"></span>
          <span data-i18n="sidebar.transcripts">Transcripts</span>
          <span class="count-badge" id="transcriptCount">0</span>
        </div>
        <div class="sidebar-btns">
          <button class="icon-btn" id="refreshListBtn" title="Refresh list" data-i18n-title="sidebar.refreshTitle">↻</button>
          <button class="icon-btn" id="collapseSidebarBtn" title="Collapse projects sidebar" data-i18n-title="sidebar.collapseTitle">«</button>
        </div>
      </div>

      <div class="sidebar-controls">
        <input type="search" id="sidebarSearch" class="input" placeholder="Search title, project, ID…" data-i18n-placeholder="sidebar.searchPlaceholder">
        <select id="projectFilter" class="select">
          <option value="" data-i18n="sidebar.allProjects">All projects</option>
        </select>
      </div>

      <div class="transcript-list" id="transcriptList">
        <div class="empty-hint" data-i18n="app.loadingList">Loading sessions…</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar" id="topbar">
        <div class="topbar-left-wrap">
          <button class="icon-btn hidden" id="expandSidebarBtn" title="Show projects sidebar" data-i18n-title="sidebar.expandTitle">☰</button>
          <div class="topbar-left">
            <div class="conv-title" id="convTitle" data-i18n="topbar.selectTranscript">Select a transcript on the left</div>
            <div class="conv-meta" id="convMeta"></div>
          </div>
        </div>
        <div class="topbar-right">
          <button type="button" class="icon-btn top-term-btn" id="openProjTermBtn" title="Open console in project folder" data-i18n-title="topbar.openTerminalTitle" aria-label="Open console in project folder">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="1.5" y="2.5" width="13" height="11" rx="2"/>
              <polyline points="4.5 6 7 8 4.5 10"/>
              <line x1="8.5" y1="10" x2="11.5" y2="10"/>
            </svg>
          </button>
          <select id="langSelect" class="select-sm lang-select" title="Interface language (English / Russian)" data-i18n-title="topbar.langTitle" aria-label="Language">
            <option value="en">🌐 EN</option>
            <option value="ru">🌐 RU</option>
          </select>
          <button class="btn-sm theme-btn" id="themeToggle" title="Toggle theme (Day / Night)" data-i18n-title="topbar.themeTitle">☀️ Day</button>
          <div class="live-pill" id="livePill" title="SSE connection status" data-i18n-title="topbar.liveTitle">
            <span class="live-dot"></span>
            <span id="liveText" data-i18n="topbar.liveWaiting">Waiting</span>
          </div>
          <label class="toggle-btn" title="Auto-scroll to bottom as new steps arrive" data-i18n-title="topbar.followTitle">
            <input type="checkbox" id="followToggle" checked>
            <span data-i18n="topbar.follow">Follow</span>
          </label>
          <button class="icon-btn" id="collapseHeaderBtn" title="Collapse header and toolbar" data-i18n-title="topbar.collapseHeaderTitle">▲</button>
        </div>
      </header>

      <div class="floating-top-bar hidden" id="floatingTopBar">
        <button class="btn-sm floating-pill hidden" id="floatingSidebarBtn" title="Show projects sidebar" data-i18n-title="topbar.floatingProjectsTitle" data-i18n="topbar.floatingProjects">☰ Projects</button>
        <button class="btn-sm floating-pill" id="expandHeaderBtn" title="Expand header & toolbar" data-i18n-title="topbar.floatingPanelTitle" data-i18n="topbar.floatingPanel">▼ Toolbar</button>
      </div>

      <div class="toolbar" id="toolbar">
        <div class="filter-group" role="group">
          <button class="filter-btn active" data-filter="all" title="Show all log steps: messages, tool_calls, GENERIC tool outputs, and system events" data-i18n="toolbar.filterAll" data-i18n-title="toolbar.filterAllTitle">All</button>
          <button class="filter-btn" data-filter="dialog" title="Clean conversation only: user prompts, final AI answers, checkpoints, and errors" data-i18n="toolbar.filterDialog" data-i18n-title="toolbar.filterDialogTitle">Dialog</button>
          <button class="filter-btn" data-filter="errors" title="Steps with errors only (ERROR_MESSAGE, status=ERROR, or non-zero exit codes)" data-i18n="toolbar.filterErrors" data-i18n-title="toolbar.filterErrorsTitle">Errors</button>
        </div>

        <label class="toggle-btn" title="Show only steps and commands that ended with an error (non-zero exit code or ERROR)" data-i18n-title="toolbar.cmdErrorsTitle">
          <input type="checkbox" id="onlyCmdErrorsToggle">
          <span data-i18n="toolbar.cmdErrors">⚠ Cmd Errors</span>
        </label>

        <div class="search-box-wrap" id="searchBoxWrap">
          <input type="search" id="stepSearch" class="input search-steps" placeholder="Search: words AND, &quot;exact phrase&quot;, OR, NOT/!…" data-i18n-placeholder="toolbar.searchPlaceholder" autocomplete="off">
          <button type="button" id="searchOptsBtn" class="search-opts-btn" title="Search options &amp; query syntax" data-i18n-title="searchPopover.toggleTitle" aria-expanded="false">⚙</button>
          <div id="searchPopover" class="search-popover hidden" role="dialog" aria-label="Search options"></div>
        </div>

        <div class="toolbar-actions">
          <button class="btn-sm" id="expandAllBtn" title="Expand all thinking and tool_calls blocks" data-i18n="toolbar.expandAll" data-i18n-title="toolbar.expandAllTitle">Expand all</button>
          <button class="btn-sm" id="collapseAllBtn" title="Collapse all thinking and tool_calls blocks" data-i18n="toolbar.collapseAll" data-i18n-title="toolbar.collapseAllTitle">Collapse all</button>
          <button class="btn-sm" id="jumpMapBtn" title="Jump to table of contents &amp; cache map at the start of the session" data-i18n="toolbar.toc" data-i18n-title="toolbar.tocTitle">📑 Contents</button>
          <button class="btn-sm" id="openCmdMapBtn" title="Open command &amp; event map with statistics and right-side minimap markers" data-i18n="toolbar.cmdMap" data-i18n-title="toolbar.cmdMapTitle">📊 Command Map</button>
        </div>

        <div class="session-stats" id="sessionStats"></div>
      </div>

      <div class="feed-stage">
        <div class="feed-wrap" id="feedWrap" tabindex="-1">
          <div class="feed" id="feed">
            <div class="welcome">
              <h2 data-i18n="app.welcomeHeading">Antigravity Transcript Viewer</h2>
              <p data-i18n="app.welcomeDesc">Select a session in the left panel. The log file is read incrementally without locking writes and updates in real time.</p>
            </div>
          </div>
        </div>
        <div class="prompt-minimap" id="promptMinimap" title="User prompts &amp; markers — hover to preview, click to jump" data-i18n-title="minimap.trackTitle"></div>
      </div>

      <div class="minimap-preview hidden" id="minimapPreview"></div>
      <button class="jump-top hidden" id="jumpTopBtn" title="Scroll to the top" data-i18n="minimap.jumpTop" data-i18n-title="minimap.jumpTopTitle">↑ Top</button>
      <button class="jump-bottom hidden" id="jumpBottomBtn" data-i18n="minimap.jumpBottom">↓ Bottom</button>

      <form class="composer" id="composerForm">
        <div class="composer-resizer" id="composerResizer" title="Drag up or down to resize input height" data-i18n-title="composer.resizerTitle"></div>
        <div class="composer-inner">
          <textarea id="promptInput" class="composer-input" rows="3" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Write a message… (Enter — paste into Antigravity without sending, Shift+Enter — newline)"></textarea>
          <div class="composer-actions">
            <div class="composer-top-row">
              <span class="composer-status" id="composerStatus"></span>
              <button type="button" class="icon-btn" id="collapseComposerBtn" title="Collapse input box" data-i18n-title="composer.collapseTitle">▼</button>
            </div>
            <button type="submit" class="btn-sm composer-send" id="composerSendBtn" title="Copy text, activate Antigravity.exe window, and paste (does not press Enter)">Paste into Antigravity ↗</button>
          </div>
        </div>
      </form>
      <button type="button" class="btn-sm floating-pill expand-composer-btn hidden" id="expandComposerBtn" title="Expand input box" data-i18n="composer.expandBtn" data-i18n-title="composer.expandTitle">▲ Write</button>
    </main>
  </div>

  <div class="modal hidden" id="cmdMapModal">
    <div class="modal-card cmd-map-card">
      <div class="modal-head">
        <span data-i18n="cmdMap.modalTitle">📊 Executed Commands &amp; Events Map</span>
        <div class="modal-actions">
          <label class="toggle-btn" title="When enabled, the feed shows only the event types and tools checked here" data-i18n-title="cmdMap.filterOnlyTitle">
            <input type="checkbox" id="cmdMapFilterOnly">
            <span data-i18n="cmdMap.filterOnly">Show selected only</span>
          </label>
          <button type="button" class="btn-sm" id="cmdMapSelectAll" data-i18n="cmdMap.selectAll">Select all</button>
          <button type="button" class="btn-sm" id="cmdMapClear" data-i18n="cmdMap.clear">Reset</button>
          <button type="button" class="btn-sm" id="cmdMapClose" data-i18n="cmdMap.close">✕ Close</button>
        </div>
      </div>
      <div class="cmd-map-body" id="cmdMapBody"></div>
    </div>
  </div>

  <div class="modal hidden" id="fileOpenModal">
    <div class="modal-card file-open-card">
      <div class="modal-head">
        <span id="fileOpenTitle" data-i18n="fileModal.titleDefault">Open file</span>
        <div class="modal-actions">
          <button type="button" class="btn-sm" id="fileOpenCopyPathBtn" title="Copy path to clipboard" data-i18n="fileModal.copyPath" data-i18n-title="fileModal.copyPathTitle">📋 Copy path</button>
          <button type="button" class="btn-sm" id="fileOpenCloseBtn" data-i18n="fileModal.close">✕ Close</button>
        </div>
      </div>
      <div class="file-open-body">
        <div class="file-open-path" id="fileOpenPathPreview"></div>
        <div class="file-open-choices">
          <button type="button" class="file-choice-btn" data-file-mode="browser_fmt">
            <span class="file-choice-title" data-i18n="fileModal.browserFmtTitle">🌐 Open formatted in browser</span>
            <span class="file-choice-desc" data-i18n="fileModal.browserFmtDesc">HTML pages, Markdown, formatted JSON, code &amp; text with line numbers</span>
          </button>
          <button type="button" class="file-choice-btn" data-file-mode="browser_raw">
            <span class="file-choice-title" data-i18n="fileModal.browserRawTitle">📄 Open as plain text (Raw)</span>
            <span class="file-choice-desc" data-i18n="fileModal.browserRawDesc">Unformatted raw source text (text/plain) without HTML/Markdown rendering</span>
          </button>
          <button type="button" class="file-choice-btn" id="fileOpenNotepadChoice" data-file-mode="notepadpp">
            <span class="file-choice-title" data-i18n="fileModal.notepadTitle">📝 Edit in Notepad++</span>
            <span class="file-choice-desc" data-i18n="fileModal.notepadDesc">Open code/text for editing in Notepad++ (does not execute scripts like .py)</span>
          </button>
          <button type="button" class="file-choice-btn" id="fileOpenSystemChoice" data-file-mode="system">
            <span class="file-choice-title" data-i18n="fileModal.systemTitle">🖥️ Run / open in system app</span>
            <span class="file-choice-desc" id="fileOpenSystemDesc" data-i18n="fileModal.systemDesc">Open or execute with OS association (runs interpreter for scripts like .py; viewer for PDF/media)</span>
          </button>
        </div>
        <label class="file-remember-check">
          <input type="checkbox" id="fileOpenRememberCheck">
          <span data-i18n="fileModal.remember">Remember choice for all files (change or reset later in settings under 📑 Contents)</span>
        </label>
      </div>
    </div>
  </div>

  <div class="lightbox hidden" id="lightbox">
    <img id="lightboxImg" alt="Attachment preview">
  </div>

  <div class="tooltip hidden" id="tooltip"></div>

  <script src="/static/app.js"></script>
</body>
</html>
